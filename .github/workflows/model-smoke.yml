name: model smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: RUN_MODEL_SMOKE=1 uv run pytest -m model
